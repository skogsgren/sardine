# configure through the environment or a .env file next to this one:
#   SANDBOX_PROJECT_FOLDER  absolute path of the folder the agent may see
#   GATEWAY_KEY             LiteLLM API key, read by gateway only (optional)
#   GATEWAY_URL             LiteLLM origin URL, scheme and host, no path (optional)
#   OPENAI_API_KEY          OpenAI API key, read by gateway only (optional)
#   OPENROUTER_API_KEY      OpenRouter API key, read by gateway only (optional)
#   SANDBOX_IMAGE           image reference (defaults to the local build tag)
x-project: &project ${SANDBOX_PROJECT_FOLDER:?set SANDBOX_PROJECT_FOLDER to the folder the agent may see}

name: sardine

services:
  sandbox:
    image: ${SANDBOX_IMAGE:-sardine:latest}
    container_name: sardine
    init: true
    restart: unless-stopped
    network_mode: "service:gateway"
    command: sleep infinity
    depends_on:
      - gateway
    working_dir: *project
    volumes:
      - type: bind
        source: *project
        target: *project
      - type: bind
        source: ${HOME}/.pi
        target: /home/node/.pi
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/opencode
        target: /home/node/.config/opencode
        bind:
          create_host_path: false
      - sandbox-home:/home/node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    tmpfs:
      - /tmp:size=2G,mode=1777,exec

  gateway:
    image: caddy:2-alpine
    container_name: sardine-gateway
    restart: unless-stopped
    volumes:
      - ./gateway.Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      GATEWAY_KEY: ${GATEWAY_KEY:-}
      GATEWAY_URL: ${GATEWAY_URL:-http://127.0.0.1:4000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

volumes:
  sandbox-home:
